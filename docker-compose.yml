services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xy_store
      POSTGRES_PASSWORD: xy_store
      POSTGRES_DB: xy_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xy_store"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
